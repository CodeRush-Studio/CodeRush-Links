<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeRush Studio | الروابط</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Modern Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 3rem;
        }

        /* --- Section 1: Header --- */
        .main-header {
            width: 100%;
            padding: 3rem 2rem 1.5rem 2rem;
            display: flex;
            justify-content: center;
        }

        .header-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2.5rem;
            width: 100%;
            max-width: 900px;
        }

        .profile-pic {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .profile-pic:hover {
            transform: scale(1.05);
        }

        .right-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .studio-name {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(to left, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* تصميم رقم الاصدار */
        .version-tag {
            font-size: 0.85rem;
            font-weight: bold;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 0.15rem 0.6rem;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-top: -0.2rem;
            margin-bottom: 1.2rem;
            letter-spacing: 0.5px;
        }

        /* بوكس النبذة والستيكر القابل للتخصيص */
        .description-box {
            /* لتحريك الاستيكر  هنا */
            --sticker-top: -55px;
            --sticker-left: -40px;
            --sticker-width: 150px;
            --sticker-rotation: 0deg;

            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 1.5rem;
            border-radius: 15px;
            font-size: 1.05rem;
            line-height: 1.6;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            position: relative; 
            width: 100%;
        }

        .description-box h3 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
            font-size: 1.15rem;
        }

        /* كود حركة الاستيكر الطائر */
        @keyframes stickerFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(3deg); }
        }

        .sticker {
            position: absolute;
            top: var(--sticker-top);
            left: var(--sticker-left);
            width: var(--sticker-width);
            height: auto;
            pointer-events: none; /* لكي لا يمنعك من تحديد النص بالفأرة */
            animation: stickerFloat 3s ease-in-out infinite;
            transform: rotate(var(--sticker-rotation));
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        /* --- Section 2: Links --- */
        .links-section {
            width: 100%;
            max-width: 900px;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .content-box {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .box-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 1.8rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .box-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to left, rgba(255,255,255,0.1), transparent);
        }

        /* السوشيال ميديا */
        .social-box {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
        }

        .social-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #fff;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            transform: translateY(-8px);
        }

        .social-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            background: #1e293b;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .social-link:hover .youtube {
            background: #ff0000;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
        }

        .social-link:hover .tiktok {
            background: #000;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .social-link span {
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* قسم المنتجات */
        .products-grid {
            display: flex;
            gap: 2.5rem;
        }

        .product-section {
            flex: 1;
        }

        .product-section h3 {
            color: #38bdf8;
            margin-bottom: 1.2rem;
            font-size: 1.1rem;
            text-align: center;
        }

        .vertical-line {
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.1), transparent);
        }

        .product-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .product-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .product-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(-5px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .product-item i {
            color: #38bdf8;
        }

        /* زر باتريون والدعم */
        .donate-box {
            width: 100%;
        }

        /* زر Buy Me a Coffee الاحترافي الجديد */
        .bmac-button {
            background: linear-gradient(135deg, #FFDD00 0%, #F7C300 100%);
            color: #000;
            padding: 1.1rem;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.2rem;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 221, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.1);
            margin-bottom: 1rem; /* مسافة بينه وبين زر باتريون */
            width: 100%;
        }

        .bmac-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px rgba(255, 221, 0, 0.4);
        }
        
        .bmac-button i {
            color: #000;
            font-size: 1.3rem;
        }

        .donate-button {
            background: linear-gradient(135deg, #FF424D 0%, #d8313a 100%);
            color: #fff;
            padding: 1.1rem;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.2rem;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 66, 77, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }

        .donate-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px rgba(255, 66, 77, 0.4);
        }

        /* =============================================
           Responsive Design: التوافق التام مع الهواتف والتابلت
           ============================================= */
        @media (max-width: 1024px) {
            /* تعديلات تناسب أجهزة التابلت المتوسطة */
            .header-content, .products-grid {
                gap: 2rem;
            }
        }

        @media (max-width: 768px) {
            /* التوافق التام مع الهواتف الذكية */
            .main-header {
                padding: 2rem 1.5rem 1rem 1.5rem;
            }
            .header-content {
                flex-direction: column;
                text-align: center;
                gap: 1.5rem;
            }
            .right-side {
                align-items: center;
            }
            .studio-name {
                font-size: 2.2rem;
            }
            .profile-pic {
                width: 140px;
                height: 140px;
            }
            .links-section {
                padding: 1rem 1.5rem;
                gap: 1.5rem;
            }
            .content-box {
                padding: 1.5rem;
            }
            .products-grid {
                flex-direction: column;
                gap: 1.5rem;
            }
            .vertical-line {
                display: none; /* إخفاء الخط العمودي الفاصل على الموبايل لعدم الحاجة له */
            }
            .product-section h3 {
                margin-bottom: 0.8rem;
            }
            .social-box {
                gap: 2rem;
            }
            .social-icon {
                width: 70px;
                height: 70px;
                font-size: 1.8rem;
            }
            .bmac-button, .donate-button {
                font-size: 1.1rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <!-- صندوق الهيدر: الصورة الشخصية واسم الاستوديو -->
        <div class="header-content">
            <div class="left-side">
                <!-- الصورة البارزة في الهيدر -->
                <img src="sticker.png" alt="CodeRush Studio" class="profile-pic">
            </div>
            <div class="right-side">
                <!-- اسم الاستوديو ورقم الاصدار -->
                <h1 class="studio-name">CodeRush Studio</h1>
                <span class="version-tag">v1.2</span>
                
                <!-- صندوق النبذة مع استيكر قابل للتحريك -->
                <div class="description-box">
                    <h3>نبذة:</h3>
                    <p>مرحبا ,

انا سيف الدين صاحب قناة 

HENDOO

و مطور العاب و برامج مستقل </p>
                    
                    <img src="logo.png" alt="Logo Sticker" class="sticker">
                </div>
            </div>
        </div>
    </header>

    <main class="links-section">
        
        <div class="content-box">
            <div class="box-title"><i class="fa-solid fa-share-nodes"></i> تابعونا على</div>
            <div class="social-box">
                <a href="https://www.youtube.com/channel/UCs1uUKPTItqwjUzAmnKaDVQ" class="social-link" target="_blank">
                    <div class="social-icon youtube"><i class="fa-brands fa-youtube"></i></div>
                    <span>اليوتيوب</span>
                </a>

                <a href="https://www.tiktok.com/@hend0o0o" class="social-link" target="_blank">
                    <div class="social-icon tiktok"><i class="fa-brands fa-tiktok"></i></div>
                    <span>تيك توك</span>
                </a>
            </div>
        </div>

        <div class="content-box">
            <div class="box-title"><i class="fa-solid fa-laptop-code"></i> منتجاتنا</div>
            <div class="products-grid">
                
                <div class="product-section">
                    <h3><i class="fa-solid fa-code"></i> برامجي</h3>
                    <ul class="product-list">
                        <li><a href="#" class="product-item">قريباً... <i class="fa-solid fa-link"></i></a></li>
                    </ul>
                </div>

                <div class="vertical-line"></div>

                <div class="product-section">
                    <h3><i class="fa-solid fa-gamepad"></i> ألعابي</h3>
                    <ul class="product-list">
                        <li><a href="https://coderush0.itch.io/" class="product-item" target="_blank">Forest 86 (Demo) <i class="fa-solid fa-ghost"></i></a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="donate-box">
            <a href="https://buymeacoffee.com/sief" class="bmac-button" target="_blank">
                <i class="fa-solid fa-mug-hot"></i> اشترِ لي قهوة (دعم سريع عبر Apple Pay)
            </a>

            <a href="https://www.patreon.com/c/HENDOO?vanity=user" class="donate-button" target="_blank">
                <i class="fa-brands fa-patreon"></i> ادعم CodeRush Studio شهرياً
            </a>
        </div>

    </main>

</body>
</html>
